<div class="ag-options">
  <!--AUTH_GATEWAY_ANCHORS-->
</div>
<script>
  // Preserve where the user was headed so /.auth/select can redirect back.
  // Every button is handled the same way, so this script is byte-identical
  // whatever the backend list is — which keeps the CSP script hash stable.
  var rd = encodeURIComponent(location.pathname + location.search);
  document.querySelectorAll('.ag-options a.ag-btn').forEach(function (a) {
    a.href = a.href + '&rd=' + rd;
  });
</script>
