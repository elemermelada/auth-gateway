<!doctype html>
<!--
  The default selector shell. Everything here is cosmetic: the buttons and the
  script that preserves the original destination are spliced in by the gateway at
  the AUTH_GATEWAY_SELECTOR placeholder below.

  A custom page (SELECTOR_HTML_FILE / SELECTOR_HTML) is a shell just like this
  one: one self-contained document, styling the widget through the ag-* classes
  (one .ag-btn per configured backend, each also carrying ag-btn-<key>).
  See README: "Custom selector page".
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Choose sign-in</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f5f6f8; color: #1a1a1a;
    }
    .card {
      background: #fff; padding: 2.5rem 2rem; border-radius: 12px;
      box-shadow: 0 6px 24px rgba(0,0,0,.08); text-align: center;
      width: 100%; max-width: 360px;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .25rem; }
    p { margin: 0 0 1.5rem; color: #666; font-size: .9rem; }
    .ag-options { display: grid; gap: .75rem; }
    /* One uniform button style: the gateway renders a button per configured
       backend and ranks none of them. A shell that wants to tell providers
       apart targets the per-backend ag-btn-<key> class. */
    a.ag-btn {
      display: block; padding: .85rem 1rem; border-radius: 8px;
      text-decoration: none; font-weight: 600; font-size: 1rem;
      background: #eef1f6; color: #1a1a1a;
      border: 1px solid #d6dae2; transition: filter .1s;
    }
    a.ag-btn:hover { filter: brightness(.95); }
    @media (prefers-color-scheme: dark) {
      body { background: #12141a; color: #e9eaed; }
      .card { background: #1c1f27; box-shadow: 0 6px 24px rgba(0,0,0,.4); }
      p { color: #9aa0ac; }
      a.ag-btn { background: #262a34; color: #e9eaed; border-color: #333947; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Choose sign-in</h1>
    <p>Select how you want to authenticate to continue.</p>
    <!--AUTH_GATEWAY_SELECTOR-->
  </main>
</body>
</html>
