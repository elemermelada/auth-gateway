## Default values for auth-gateway.
## This is a YAML-formatted file.

## Keep rendered resource names as `auth-gateway` even though the chart (and
## its OCI package) is named `auth-gateway-chart`. Override if desired.
nameOverride: "auth-gateway"
fullnameOverride: ""

replicaCount: 2

image:
  repository: ghcr.io/elemermelada/auth-gateway/auth-gateway
  tag: "latest"
  pullPolicy: IfNotPresent

## auth-gateway configuration (rendered as container env vars).
## config.backends is required — point it at the oauth2-proxy Services in this
## namespace.
config:
  listenAddr: ":8080"
  cookieName: "auth_mode"
  ## Lifetime (seconds) of a freshly picked, not-yet-proven provider choice.
  ## 900s matches oauth2-proxy's --cookie-csrf-expire default; see README.
  cookieTempMaxAge: 900
  ## How many sign-in starts one not-yet-proven choice may make before the
  ## gateway treats it as wrong and sends the user back to the selector.
  ## 1 = the trip the selection paid for, and no second one.
  cookieTempMaxStarts: 1
  ## The auth front door's own surface. Defaults describe oauth2-proxy; change
  ## them only if you put a different front door behind the gateway or moved
  ## oauth2-proxy's --proxy-prefix.
  ## authPathPrefixes: comma-separated; scopes the auth-error rewrite so app 4xx
  ## responses are never touched. A "/" entry is ignored for that same reason.
  authPathPrefixes: "/oauth2/"
  ## authCallbackPath + authSessionCookie: a 302 off the callback that also sets
  ## the session cookie is what promotes the routing cookie to its full lifetime.
  ## The cookie name is matched as a prefix (oauth2-proxy splits large sessions
  ## into _oauth2_proxy_0, _1, …).
  authCallbackPath: "/oauth2/callback"
  authSessionCookie: "_oauth2_proxy"
  ## authStartPath: exact path that hands the user off to the IdP. Empty means
  ## "any auth path answering with a 302 to another host", which is what makes
  ## the start counter work without knowing oauth2-proxy's endpoint names.
  authStartPath: ""
  ## The upstreams to route between: one entry per IdP, any number of them.
  ##   key   — stable id, [a-z0-9_-]{1,64}. It is the value stored in the user's
  ##           routing cookie and used in /.auth/select?mode=<key>, so it must not
  ##           change once users have picked a provider (and renaming a key logs
  ##           everyone using it back out to the selector).
  ##   url   — full URL of that IdP's oauth2-proxy Service.
  ##   label — optional button text; defaults to the key, first letter capitalized.
  ##           No commas (the env vars are comma-separated lists).
  ## List order is the button order on the selector page.
  ##
  ## Upgrading from a chart with config.backendPrimary / config.backendSecondary?
  ## Keep the keys `primary` and `secondary` and every routing cookie already out
  ## there stays valid — the cookie holds the key, not a position.
  backends: []
  # backends:
  #   - key: primary
  #     url: http://oauth2-proxy-public
  #     label: Employees
  #   - key: secondary
  #     url: http://oauth2-proxy-private
  #     label: Contractors
  ## Custom selector page. When non-empty, the chart puts this HTML in a ConfigMap,
  ## mounts it read-only at /etc/auth-gateway/selector.html and points
  ## SELECTOR_HTML_FILE at it; a checksum annotation on the pod template rolls the
  ## pods when it changes. Left empty, the image serves its built-in page.
  ##
  ## This is a *shell*, not a whole page: it must contain the placeholder
  ## <!--AUTH_GATEWAY_SELECTOR--> exactly once, where auth-gateway splices in the
  ## selector widget it owns (one button per config.backends entry, wired to
  ## /.auth/select). Style the widget through the ag-* classes — .ag-options for
  ## the list, a.ag-btn for every button, .ag-btn-<key> for a single provider.
  ## One self-contained document — external scripts,
  ## stylesheets and fonts are blocked by the page's CSP, so images and logos
  ## travel inline as data: URIs. A shell without the placeholder is fatal at
  ## startup, on purpose. See README: "Custom selector page".
  selectorHtml: ""
  # selectorHtml: |
  #   <!doctype html>
  #   <html lang="en">
  #   <head><meta charset="utf-8"><title>Sign in</title>
  #     <style>.ag-btn { display: block; padding: 1rem; }</style>
  #   </head>
  #   <body><h1>Acme</h1><!--AUTH_GATEWAY_SELECTOR--></body>
  #   </html>

## Extra env vars appended verbatim (e.g. valueFrom / secretKeyRef).
extraEnv: []
  # - name: SOME_VAR
  #   valueFrom:
  #     secretKeyRef:
  #       name: my-secret
  #       key: some-key

service:
  type: ClusterIP
  port: 80

## Container port the app listens on (must match config.listenAddr).
containerPort: 8080

# NOTE: This chart intentionally does NOT manage an Ingress. auth-gateway owns
# the responsibility of wiring ingresses to the correct frontdoor itself.

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 2
  periodSeconds: 10

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
