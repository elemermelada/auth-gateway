apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auth-gateway.fullname" . }}
  labels:
    {{- include "auth-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "auth-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "auth-gateway.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- /*
      The selector shell is read once at process startup, so a ConfigMap edit
      alone would never be picked up — the checksum is what rolls the pods.
      */ -}}
      {{- if or .Values.podAnnotations .Values.config.selectorHtml }}
      annotations:
        {{- with .Values.config.selectorHtml }}
        checksum/selector: {{ sha256sum . }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ include "auth-gateway.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: {{ .Values.config.listenAddr | quote }}
            - name: COOKIE_NAME
              value: {{ .Values.config.cookieName | quote }}
            - name: COOKIE_TEMP_MAX_AGE
              value: {{ .Values.config.cookieTempMaxAge | quote }}
            - name: AUTH_PATH_PREFIXES
              value: {{ .Values.config.authPathPrefixes | quote }}
            - name: AUTH_CALLBACK_PATH
              value: {{ .Values.config.authCallbackPath | quote }}
            - name: AUTH_SESSION_COOKIE
              value: {{ .Values.config.authSessionCookie | quote }}
            - name: BACKENDS
              value: {{ include "auth-gateway.backends" . | quote }}
            {{- with (include "auth-gateway.backendLabels" .) }}
            - name: BACKEND_LABELS
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.config.selectorHtml }}
            - name: SELECTOR_HTML_FILE
              value: /etc/auth-gateway/selector.html
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.config.selectorHtml }}
          volumeMounts:
            - name: selector
              mountPath: /etc/auth-gateway
              readOnly: true
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      {{- if .Values.config.selectorHtml }}
      volumes:
        - name: selector
          configMap:
            name: {{ include "auth-gateway.fullname" . }}-selector
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
